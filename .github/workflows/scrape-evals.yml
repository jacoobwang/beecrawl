name: Scrape Evals

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to evaluate
        required: false
        default: main

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '#scrape-quality-eval')) ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.body, '#scrape-quality-eval') ||
        contains(github.event.pull_request.title, '#scrape-quality-eval')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.resolve.outputs.authorized }}
      ref: ${{ steps.resolve.outputs.ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve ref and authorize actor
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const trusted = new Set(['admin', 'maintain', 'write']);
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const authorized = trusted.has(permission.data.permission);
            let ref = context.payload.inputs?.ref || context.sha;
            let prNumber = '';
            if (context.eventName === 'pull_request') {
              ref = context.payload.pull_request.head.sha;
              prNumber = String(context.payload.pull_request.number);
            } else if (context.eventName === 'issue_comment') {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              ref = pull.data.head.sha;
              prNumber = String(pull.data.number);
            }
            core.setOutput('authorized', String(authorized));
            core.setOutput('ref', ref);
            core.setOutput('pr_number', prNumber);

  eval:
    needs: resolve
    if: needs.resolve.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
      - name: Install evaluation runtime
        run: |
          uv sync --extra browser --locked
          uv run playwright install --with-deps chromium
      - name: Start Bee Engine and API
        run: |
          uv run uvicorn bee_engine.app:app --app-dir apps/bee-engine --host 127.0.0.1 --port 8020 > /tmp/bee-engine.log 2>&1 &
          cargo run -p beecrawl-api --bin beecrawl-api > /tmp/beecrawl-api.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8020/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bee-engine.log
          cat /tmp/beecrawl-api.log
          exit 1
      - name: Run scrape quality eval
        id: quality
        run: |
          set +e
          make scrape-eval
          status=$?
          cat artifacts/scrape-evals/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Show service logs after failure
        if: failure()
        run: |
          cat /tmp/bee-engine.log
          cat /tmp/beecrawl-api.log
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-eval-report
          path: artifacts/scrape-evals/
          if-no-files-found: error

  report:
    needs: [resolve, eval]
    if: >-
      always() &&
      needs.resolve.outputs.authorized == 'true' &&
      needs.resolve.outputs.pr_number != '' &&
      needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scrape-eval-report
          path: scrape-eval-report
      - name: Publish PR report
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- beecrawl-scrape-eval -->';
            const body = fs.readFileSync('scrape-eval-report/summary.md', 'utf8');
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
